name: Build Windows Portable Dashboard

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 portable ZIP
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6,<7"

      - name: Verify SBDF reader imports
        shell: pwsh
        run: |
          python -c "from spotfire import sbdf; import duckdb, pandas, flask, requests; print('SBDF/build dependencies OK')"

      - name: Build application with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm SBDFDashboard.spec

      - name: Package portable folder and ZIP
        shell: pwsh
        run: |
          ./package_portable.ps1

      - name: Smoke-test packaged dashboard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'dist/SBDF-Dashboard/SBDFDashboard.exe'
          if (-not (Test-Path $exe)) { throw "Missing packaged executable: $exe" }

          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 2
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/health' -TimeoutSec 5
                if ($response.ok -eq $true) {
                  $healthy = $true
                  Write-Host "Health check passed. Mode: $($response.mode)"
                  break
                }
              } catch {
                Write-Host "Waiting for dashboard startup..."
              }
            }
            if (-not $healthy) { throw 'Packaged dashboard did not pass /health smoke test.' }
          }
          finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: SBDF-Dashboard-Windows-x64
          path: dist/SBDF-Dashboard-Portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable folder artifact
        uses: actions/upload-artifact@v7
        with:
          name: SBDF-Dashboard-Windows-x64-folder
          path: dist/SBDF-Dashboard/
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = "dist/SBDF-Dashboard-Portable.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag `
              "$asset#SBDF Dashboard Windows x64" `
              --title "SBDF Dashboard $tag" `
              --generate-notes
          }
